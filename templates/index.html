<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020403">
  <meta name="application-name" content="2X Mosquito">
  <meta name="color-scheme" content="dark">
  <title>2X Mosquito</title>
  <link rel="stylesheet" href="/static/style.css?v=20260916-reentry">
  <script src="/static/app.js?v=20260916-reentry" defer></script>
</head>
<body>
 <main class="app-shell compact-2x">
  <header class="compact-head">
   <div class="compact-brand"><img class="hero-base" src="/static/2x-master.jpg" alt="2X Mosquito"></div>
   <div><h1>2X</h1><p>UNIVERSE TRADING</p><span id="connection-label">CONNECTING</span><span id="automation-label" class="visually-hidden"></span></div>
   <div class="live-pill"><i id="connection-dot"></i><b id="bot-status">—</b></div>
  </header>
  <section class="system-strip compact-system"><strong class="paper-badge">PAPER</strong><span><i id="alpaca-dot"></i>ALPACA <b id="alpaca-status">—</b></span><span class="hide-compact"><i id="railway-dot"></i>RAILWAY <b id="railway-status">—</b></span><span><i id="engine-dot"></i>ENGINE <b id="engine-status">—</b></span><small id="engine-cycle" class="visually-hidden"></small><span id="menu-mode" class="visually-hidden"></span></section>
  <section id="dashboard-view" class="view active">
   <section class="compact-money">
    <label for="investment">TODAY'S INVESTMENT</label>
    <div class="money-input"><span>$</span><input id="investment" type="text" inputmode="decimal" autocomplete="off" placeholder="50,000"><button id="edit-investment" type="button" aria-label="Edit investment">✎</button></div>
    <input id="investment-slider" class="visually-hidden" type="range" min="0" max="100000" step="500" value="50000"><output id="investment-slider-value" class="visually-hidden"></output><small id="investment-help">Set the amount before BUY or 2X ON.</small>
   </section>
   <section class="quick-metrics">
    <div><small>TODAY PROFIT</small><strong id="day-profit">—</strong><span id="day-profit-pct">—</span></div>
    <div><small>ACCOUNT</small><strong id="current-value">—</strong><span id="total-profit">—</span></div>
    <div><small>POSITIONS</small><strong id="positions-count">—</strong><span id="trades-count">— trades</span></div>
   </section>
   <section class="trade-actions compact-actions">
    <button id="buy-button" class="button buy" type="button">BUY</button>
    <button id="sell-button" class="button sell" type="button">SELL</button>
    <button id="start-button" class="button primary" type="button"><span id="primary-label">2X ON</span></button>
    <button id="stop-button" class="button stop" type="button">2X OFF</button>
    <button id="exit-button" class="visually-hidden" type="button">EXIT POSITIONS</button>
    <small id="action-hint">Protected paper controls</small>
   </section>
   <div id="notice" class="notice" role="status" aria-live="polite">Connecting…</div>
   <section class="compact-picks">
    <div class="compact-title"><h2>MORNING PICKS</h2><b id="risk-status">—</b><span id="risk-detail" class="visually-hidden"></span><span id="bot-detail" class="visually-hidden"></span><span id="capital" class="visually-hidden"></span></div>
    <div id="positions-list" class="data-list"><p class="empty">Loading 2X picks…</p></div>
   </section>
   <div class="visually-hidden">
    <span id="green-ribbon-status"></span><span id="green-ribbon-value"></span><span id="ribbon-starting"></span><span id="ribbon-profit"></span><span id="ribbon-gain"></span><span id="ribbon-eod"></span><span id="ribbon-asof"></span><span id="ribbon-rule"></span>
    <canvas id="profit-chart"></canvas><span id="chart-empty"></span><span id="win-rate"></span><span id="five-x-value"></span><span id="five-x-detail"></span><span id="standard-faceoff-value"></span><span id="standard-faceoff-detail"></span>
    <div id="history-list"></div><div id="performance-list"></div><div id="alerts-list"></div><b id="alert-badge"></b><span id="performance-asof"></span><div id="performance-periods"></div>
   </div>
  </section>
  <footer>2X · UNIVERSE TRADING · PAPER MODE</footer>
 </main>
</body>
</html>
